<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" role="img" aria-label="ds-budget-meter: DeepSeek 余额与用量追踪插件——顶部胶囊与展开卡片示意">
  <title>ds-budget-meter — DeepSeek 余额与用量追踪插件</title>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 44px; font-weight: 700; fill: #e5e7eb; letter-spacing: -0.5px; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #a1a1aa; }
      .meta { font-size: 16px; fill: #71717a; }
      .label { font-size: 18px; font-weight: 500; fill: #d4d4d8; }
      .note { font-size: 16px; fill: #71717a; }
      .card { fill: #171a21; stroke: #27272a; }
      .card-t { fill: #e5e7eb; }
      .muted { fill: #a1a1aa; }
      .dim { fill: #71717a; }
      .blue { fill: #4d6bfe; }
      .orange { fill: #f59e0b; }
      .green { fill: #34d399; }
      .mono { font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="780" rx="24" fill="#0d1017"/>

  <!-- 顶部：模拟 dsh 会话头部 -->
  <text x="48" y="52" class="label" font-size="15" fill="#71717a">DEEPSEEK HARNESS · 会话头部</text>

  <!-- header 容器 -->
  <rect x="48" y="70" width="1104" height="64" rx="12" fill="#11151d" stroke="#27272a"/>

  <!-- 展开侧边栏 / 展开底部面板 icon（示意） -->
  <g transform="translate(1040, 88)">
    <rect x="0" y="0" width="28" height="28" rx="8" fill="none" stroke="#3f3f46"/>
    <rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="#a1a1aa"/>
  </g>
  <g transform="translate(1076, 88)">
    <rect x="0" y="0" width="28" height="28" rx="8" fill="none" stroke="#3f3f46"/>
    <rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="#a1a1aa"/>
  </g>

  <!-- session log 按钮（secondaryButton 样式） -->
  <g transform="translate(906, 86)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="none" stroke="#3f3f46"/>
    <circle cx="16" cy="16" r="7" fill="none" stroke="#a1a1aa"/>
    <text x="32" y="21" font-size="13" fill="#e5e7eb">Session log</text>
  </g>

  <!-- 我们的胶囊（secondaryButton 同款，order -1 在 session log 左侧） -->
  <g transform="translate(740, 86)">
    <rect x="0" y="0" width="152" height="32" rx="16" fill="none" stroke="#3f3f46"/>
    <circle cx="24" cy="16" r="4" class="green"/>
    <text x="34" y="21" font-size="12" fill="#a1a1aa">空闲</text>
    <text x="78" y="21" font-size="12" class="mono" fill="#e5e7eb" font-weight="500">¥34.35</text>
  </g>

  <!-- 标注 1：胶囊 = 实时余额 -->
  <g>
    <path d="M 816 118 L 960 170" stroke="#4d6bfe" stroke-width="1.5" fill="none"/><circle cx="816" cy="118" r="3" fill="#4d6bfe"/>
    <rect x="808" y="176" width="300" height="58" rx="10" fill="#11151d" stroke="#27272a"/>
    <text x="824" y="202" font-size="17" fill="#e5e7eb">顶部胶囊：真实 DeepSeek 账户余额</text>
    <text x="824" y="224" font-size="15" fill="#71717a">host /budget/balance · 每 60 秒静默刷新 · 高峰/空闲状态点</text>
  </g>

  <!-- 展开的卡片 -->
  <g transform="translate(48, 170)">
    <rect x="0" y="0" width="300" height="430" rx="12" class="card"/>

    <!-- 卡片头 -->
    <text x="16" y="28" font-size="13" font-weight="600" class="card-t">用量与余额</text>
    <text x="176" y="28" font-size="11" class="muted">当前时段: </text>
    <circle cx="252" cy="24" r="4" class="green"/>
    <text x="262" y="28" font-size="11" class="green">空闲</text>

    <!-- 余额区块 -->
    <line x1="16" y1="44" x2="284" y2="44" stroke="#27272a"/>
    <text x="16" y="66" font-size="11" class="muted">总余额</text>
    <text x="16" y="98" font-size="28" font-weight="700" class="mono card-t">¥34.35</text>
    <rect x="196" y="70" width="88" height="28" rx="14" fill="none" stroke="#3f3f46"/>
    <text x="212" y="89" font-size="12" fill="#4d6bfe">去充值 →</text>
    <text x="16" y="126" font-size="12" class="muted">赠送余额</text>
    <text x="268" y="126" font-size="12" class="mono card-t">¥0.00</text>
    <text x="16" y="146" font-size="12" class="muted">充值余额</text>
    <text x="268" y="146" font-size="12" class="mono card-t">¥34.35</text>

    <!-- 消费统计 -->
    <line x1="16" y1="160" x2="284" y2="160" stroke="#27272a"/>
    <text x="16" y="182" font-size="12" class="muted">今日已花费</text>
    <text x="268" y="182" font-size="12" class="mono card-t">≈¥0.00</text>
    <text x="16" y="202" font-size="12" class="muted">累计（含往期）</text>
    <text x="268" y="202" font-size="12" class="mono card-t">¥128.46</text>

    <!-- tokens -->
    <text x="16" y="232" font-size="11" class="dim">今日 TOKENS</text>
    <text x="16" y="254" font-size="12" class="muted">输入（缓存命中）</text>
    <text x="268" y="254" font-size="12" class="mono card-t">12.4k</text>
    <text x="16" y="274" font-size="12" class="muted">输入（缓存未命中）</text>
    <text x="268" y="274" font-size="12" class="mono card-t">68.2k</text>
    <text x="16" y="294" font-size="12" class="muted">输出</text>
    <text x="268" y="294" font-size="12" class="mono card-t">21.7k</text>

    <!-- 设置 -->
    <line x1="16" y1="310" x2="284" y2="310" stroke="#27272a"/>
    <text x="16" y="336" font-size="11" class="dim">设置</text>
    <text x="16" y="362" font-size="12" class="muted">花费提醒阈值（元）</text>
    <rect x="188" y="348" width="96" height="24" rx="6" fill="#262b36" stroke="#27272a"/>
    <text x="204" y="364" font-size="12" class="mono card-t">20</text>
    <text x="16" y="396" font-size="12" class="muted">达到阈值自动停止回合</text>
    <rect x="262" y="382" width="14" height="14" rx="4" fill="#262b36" stroke="#3f3f46"/>
    <path d="M 265 389 l 3 3 l 5 -6" stroke="#34d399" stroke-width="2" fill="none"/>
  </g>

  <!-- 标注 2：余额区块 + 充值跳转 -->
  <g>
    <path d="M 348 240 L 430 200" stroke="#4d6bfe" stroke-width="1.5" fill="none"/><circle cx="348" cy="240" r="3" fill="#4d6bfe"/>
    <rect x="436" y="128" width="300" height="64" rx="10" fill="#11151d" stroke="#27272a"/>
    <text x="452" y="156" font-size="17" fill="#e5e7eb">余额分项 + 充值快捷跳转</text>
    <text x="452" y="178" font-size="15" fill="#71717a">「去充值」在系统浏览器打开 platform.deepseek.com/top_up</text>
  </g>

  <!-- 标注 3：官方消费数据 -->
  <g>
    <path d="M 348 330 L 560 356" stroke="#4d6bfe" stroke-width="1.5" fill="none"/><circle cx="348" cy="330" r="3" fill="#4d6bfe"/>
    <rect x="566" y="316" width="320" height="64" rx="10" fill="#11151d" stroke="#27272a"/>
    <text x="582" y="344" font-size="17" fill="#e5e7eb">消费统计来自 DeepSeek 官方</text>
    <text x="582" y="366" font-size="15" fill="#71717a">platform token → 官方用量接口；无 token → 余额差值估算（≈）</text>
  </g>

  <!-- 标注 4：按金额提醒 -->
  <g>
    <path d="M 348 396 L 560 420" stroke="#4d6bfe" stroke-width="1.5" fill="none"/><circle cx="348" cy="396" r="3" fill="#4d6bfe"/>
    <rect x="566" y="390" width="320" height="64" rx="10" fill="#11151d" stroke="#27272a"/>
    <text x="582" y="418" font-size="17" fill="#e5e7eb">按金额的提醒阈值</text>
    <text x="582" y="440" font-size="15" fill="#71717a">今日花费 ≥ 阈值弹 toast，可自动取消当前回合</text>
  </g>

  <!-- 标题区 -->
  <text x="48" y="690" class="title">ds-budget-meter</text>
  <text x="48" y="726" class="subtitle">DeepSeek 余额监控 + 用量追踪插件，融入 dsh 会话头部</text>
  <text x="48" y="752" class="meta" fill="#8b8b92">fork 自 ai-suifeng/dsh-budget-meter · MIT License</text>
</svg>
